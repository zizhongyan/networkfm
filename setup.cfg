[metadata]
name = networkfm
version = attr: networkfm.__version__
author = Zizhong Yan
author_email = helloyzz@gmail.com
description = A Python package for econometric analysis of dyadic network formation models with degree heterogeneity
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/zizhongyan/networkfm
license = MIT
license_files = LICENSE
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

project_urls =
    Source = https://github.com/zizhongyan/networkfm
    Documentation = https://networkfm.readthedocs.io/
    Issues = https://github.com/zizhongyan/networkfm/issues

[options]
packages = find:
python_requires = >=3.8
include_package_data = True
zip_safe = False
install_requires =
    numpy
    scipy
    pandas
    torch

[options.packages.find]
include =
    networkfm
    networkfm.*
exclude =
    tests
    tests.*
